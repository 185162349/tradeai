<!DOCTYPE html>
<html lang="en">
<head>

    <div>&copy; {{YEAR}} {{SITE_NAME}} &middot; {{TAGLINE}}</div>
    <nav>
      <a href="/about/">About</a>
      <a href="/privacy/">Privacy</a>
